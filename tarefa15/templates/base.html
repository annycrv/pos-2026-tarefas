<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente SUAP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .navbar{
            box-shadow:0 2px 10px rgba(0,0,0,.15);
        }

        .foto-navbar{
            width:45px;
            height:45px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid white;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .table th{
            text-align:center;
        }

        .table td{
            vertical-align:middle;
        }
    </style>

</head>

<body>

{% if usuario %}
<nav class="navbar navbar-expand-lg navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{{ url_for('perfil') }}">
            Cliente SUAP
        </a>

        <div class="ms-auto d-flex align-items-center">

            <img
                src="{{ usuario.url_foto_75x100 }}"
                class="foto-navbar me-3">

            <div class="text-white me-4">

                <strong>{{ usuario.nome_usual }}</strong><br>

                <small>{{ usuario.matricula }}</small>

            </div>

            <a href="{{ url_for('perfil') }}"
               class="btn btn-outline-light me-2">

                Perfil

            </a>

            <a href="{{ url_for('boletim') }}"
               class="btn btn-outline-light me-2">

                Boletim

            </a>

            <a href="{{ url_for('logout') }}"
               class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</nav>
{% endif %}

<div class="container py-5">

{% block conteudo %}
{% endblock %}

</div>

</body>
</html>
